# Publishes the site: on every merge to main, and every Thursday afternoon after the Drought Monitor's weekly release.
# The Cloudflare token is in the protected `production` environment only. The factory never sees it (ADR 0001).
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 4" # Thursday 20:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Publish the data and build the site
        run: |
          just publish
          cd ui && pnpm install --frozen-lockfile --silent && pnpm build

      - name: Deploy to Cloudflare
        working-directory: ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
