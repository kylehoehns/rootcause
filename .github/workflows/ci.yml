# The required `ci` check: `just check`, as agents and people run it locally.
# Runs on pull_request only (never pull_request_target), so fork PRs get no secrets and a read-only token.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Browsers for the Playwright journeys
        working-directory: ui
        run: pnpm install --frozen-lockfile --silent && pnpm exec playwright install --with-deps chromium

      - name: Check (pipeline, publish, UI)
        run: just check

      - name: Lint workflows and shell scripts (the factory's own controls)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            .claude/hooks/*.sh scripts/*.sh

      # The journeys' screenshots: evidence of what a UI change looks like. Public, like everything in this repo.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ui/test-results/
          retention-days: 14
