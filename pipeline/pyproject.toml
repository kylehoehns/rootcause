[project]
name = "rootcause-pipeline"
version = "0.1.0"
description = "Iowa crop insurance losses, published as JSON for the UI."
requires-python = "==3.13.*"
dependencies = [
  "dbt-core==1.12.6",
  "dbt-duckdb==1.11.0",
  "duckdb==1.5.6",
  "jsonschema==4.26.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0", "sqlfluff==4.4.0"]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
