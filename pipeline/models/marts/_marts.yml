# The marts are a published contract: their columns must match contracts/*.schema.json.
models:
  - name: county_indemnity
    config:
      contract: { enforced: true }
    columns:
      - name: year
        data_type: integer
        data_tests: [not_null]
      - name: county_fips
        data_type: varchar
        data_tests: [not_null]
      - name: county_name
        data_type: varchar
      - name: indemnity
        data_type: bigint
