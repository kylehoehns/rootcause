# The marts are a published contract: their columns must match contracts/*.schema.json.
models:
  - name: county_losses
    config:
      contract: { enforced: true }
    columns:
      - name: year
        data_type: integer
        data_tests: [not_null]
      - name: county_fips
        data_type: varchar
        data_tests: [not_null]
      - name: crop
        data_type: varchar
        data_tests: [not_null]
      - name: cause
        data_type: varchar
        data_tests: [not_null]
      - name: indemnity
        data_type: decimal(38, 2)
        data_tests: [not_null]
